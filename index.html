        }

            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;

        // --- MAP INITIALIZATION ---
        const map = L.map('map').setView([32.7600, -16.9500], 10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // --- ICONS AND COLORS ---
        const colorMapping = {
            "Funchal e Monte": "blue",
            "Costa Sud": "green",
            "Costa Ovest e altipiani": "red",
            "Costa Nord": "orange",
            "Costa Est": "violet",
            "Montagne Centrali e Laurissilva": "gold"
        };

        function createIcon(color) {
            return new L.Icon({
                iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${color}.png`,
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [1, -34],
                shadowSize: [41, 41]
            });
        }

        const icons = Object.keys(colorMapping).reduce((acc, key) => {
            acc[colorMapping[key]] = createIcon(colorMapping[key]);
            return acc;
        }, {});

        // --- POPULATE SIDEBAR AND MAP MARKERS ---
        const markers = {};
        const locationList = document.getElementById('location-list');
        let currentGroup = "";

        // Function to create the detailed popup content
        function createPopupContent(location) {
            let content = `<div class="p-4 max-h-80 overflow-y-auto text-gray-700">`;


            content += `<h3 class="font-bold text-lg mb-2 text-gray-900">${location.name}</h3>`;

            // Pulsante Google Maps con coordinate
            const gmapsUrlCoords = `https://www.google.com/maps/search/?api=1&query=${location.lat},${location.lng}`;
            content += `<a href="${gmapsUrlCoords}" target="_blank" rel="noopener" class="inline-block mb-2 px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition text-sm font-medium mr-2">
                <span class="text-white">Apri Maps (Coordinate)</span>
            </a>`;

            // Pulsante Google Maps con nome
            const gmapsUrlName = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(location.name)}`;
            content += `<a href="${gmapsUrlName}" target="_blank" rel="noopener" class="inline-block mb-3 px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition text-sm font-medium">
                <span class="text-white">Apri Maps (Nome)</span>
            </a>`;

            const fields = [
                { label: 'Tipologia', value: location.type },
                { label: 'Geolocalizzazione', value: location.geolocation_details },
                { label: 'Descrizione', value: location.description },
                { label: 'Durata', value: location.duration },
                { label: 'Costo', value: location.cost },
                { label: 'Consigli utili', value: location.tips },
                { label: 'Da portare', value: location.what_to_bring },
                { label: 'Momento migliore', value: location.best_time },
                { label: 'Affollamento', value: location.crowd_level },
                { label: 'Da evitare', value: location.to_avoid }
            ];

            fields.forEach(field => {
                if (field.value) {
                    content += `<p class="my-1.5 text-sm"><strong class="font-semibold text-gray-800">${field.label}:</strong> ${field.value}</p>`;
                }
            });

            content += `</div>`;
            return content;
        }

        locations.forEach(location => {
            if (location.group !== currentGroup) {
                currentGroup = location.group;
                const groupHeader = document.createElement('div');
                groupHeader.className = 'p-4 bg-gray-200 text-gray-800 font-bold sticky top-0';
                groupHeader.textContent = currentGroup;
                locationList.appendChild(groupHeader);
            }

            const listItem = document.createElement('div');
            listItem.className = 'location-item';
            listItem.textContent = location.name;
            listItem.onclick = () => {
                map.flyTo([location.lat, location.lng], 14);
                markers[location.name].openPopup();
            };
            locationList.appendChild(listItem);

            const markerColor = colorMapping[location.group] || 'blue';
            const marker = L.marker([location.lat, location.lng], { icon: icons[markerColor] }).addTo(map)
                .bindPopup(createPopupContent(location));

            markers[location.name] = marker;
        });

        // --- LEGEND CONTROL ---
        const legend = L.control({ position: 'bottomright' });
        legend.onAdd = function (map) {
            const div = L.DomUtil.create('div', 'info legend');
            const groups = Object.keys(colorMapping);
            let labels = ['<strong>Legenda Aree</strong>'];
            groups.forEach(group => {
                labels.push(
                    `<i style="background-image: url(https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${colorMapping[group]}.png); background-size: contain;"></i> ${group}`
                );
            });
            div.innerHTML = labels.join('<br>');
            return div;
        };
        legend.addTo(map);

        // --- RESPONSIVE BEHAVIOR ---
        const sidebar = document.getElementById('sidebar');
        const mapContainer = document.getElementById('map');
        function checkScreenSize() {
            if (window.innerWidth < 768) {
                sidebar.classList.add('hidden');
                mapContainer.classList.remove('md:w-2/3', 'lg:w-3/4', 'xl:w-4/5');
            } else {
                sidebar.classList.remove('hidden');
                mapContainer.classList.add('md:w-2/3', 'lg:w-3/4', 'xl:w-4/5');
            }
            setTimeout(() => { map.invalidateSize(); }, 100);
        }
        checkScreenSize();
        window.addEventListener('resize', checkScreenSize);
    </script>
